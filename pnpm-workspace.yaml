onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - bigint-buffer
  - bufferutil
  - esbuild
  - keccak
  - sharp
  - utf-8-validate

# The patch file lives in the shared submodule so every app consuming it carries one copy;
# the declaration must stay here, since pnpm only honours patchedDependencies from the root
# of the project doing the install and shared takes thirdweb as a peer dep it never installs.
patchedDependencies:
  thirdweb@5.120.0: src/shared/patches/thirdweb@5.120.0.patch
